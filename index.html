<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Storage Full</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa9c4; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; }
  #phone { position: fixed; inset: 0; pointer-events: none; will-change: transform; }
  #phone canvas { position: absolute; }
  #msg:empty { display: none; }
  #msg { position: fixed; left: 16px; top: 46px; max-width: calc(100vw - 32px); font-size: 14px; background: rgba(20,22,28,.75); border-radius: 10px; padding: 8px 12px; pointer-events: none; }
  #lvl { position: fixed; left: 16px; top: 12px; font-size: 13px; font-weight: 600; background: rgba(20,22,28,.75); border-radius: 10px; padding: 6px 10px; pointer-events: none; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #banner { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: clamp(26px, 6vw, 44px); font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; display: none; white-space: nowrap; }
  #start { position: fixed; inset: 0; background: rgba(20,22,30,.82); display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; cursor: pointer; }
  #start h1 { margin: 0 0 8px; font-size: clamp(32px, 7vw, 56px); }
  #start p { margin: 6px 0; opacity: .85; font-size: 15px; line-height: 1.5; }
  #start .go { display: inline-block; margin-top: 14px; padding: 11px 24px; background: #ffe14a; color: #222; font-weight: 700; border-radius: 999px; }
  #touch { display: none; }
  #touch button { position: fixed; width: 58px; height: 58px; border-radius: 50%; border: 0; background: rgba(20,22,28,.55); color: #fff; font-size: 22px; touch-action: none; }
  #tSnap { right: 18px; bottom: 40px; width: 76px !important; height: 76px !important; background: rgba(255,225,74,.9) !important; color: #222 !important; }
  #tJump { right: 110px; bottom: 30px; }
  #tPlus { right: 26px; bottom: 132px; }
  #tMinus { right: 96px; bottom: 112px; }
</style>
</head>

// ---------------------------------------------------------------- render
function bindCube() {
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, cubeBuf); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIdx);
  gl.enableVertexAttribArray(A.p); gl.vertexAttribPointer(A.p, 3, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(A.n); gl.vertexAttribPointer(A.n, 3, gl.FLOAT, false, 32, 12);
  gl.enableVertexAttribArray(A.uv); gl.vertexAttribPointer(A.uv, 2, gl.FLOAT, false, 32, 24);
}
function render(time, showGhost) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = canvas.clientWidth * dpr | 0, h = canvas.clientHeight * dpr | 0;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const fov = 1.2, asp = w / h, e = eye();
  gl.disable(gl.DEPTH_TEST); gl.useProgram(skyProg);
  gl.disableVertexAttribArray(A.n); gl.disableVertexAttribArray(A.uv);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.enableVertexAttribArray(skyU.p); gl.vertexAttribPointer(skyU.p, 2, gl.FLOAT, false, 0, 0);
  const cy = Math.cos(player.yaw), syw = Math.sin(player.yaw), cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  gl.uniformMatrix3fv(skyU.rot, false, new Float32Array([cy, 0, -syw, syw * sp, cp, cy * sp, syw * cp, -sp, cy * cp]));
  gl.uniform2f(skyU.k, Math.tan(fov / 2) * asp, Math.tan(fov / 2));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); bindCube();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cubeTex); gl.uniform1i(U.uTex, 0);
  gl.uniformMatrix4fv(U.uProj, false, M.persp(fov, asp, .05, 150));
  gl.uniformMatrix4fv(U.uView, false, M.mul(M.mul(M.rx(-player.pitch), M.ry(-player.yaw)), M.t(-e[0], -e[1], -e[2])));
  for (const s of statics) draw(boxM(s), s.c);
  for (const d of doors) draw(boxM(d), [.35, .52, .78]);
  for (const b of buttons) draw(M.mul(M.t(b.x, .03, b.z), M.s(b.r * 2, .06, b.r * 2)), b.down ? [.3, .85, .4] : [.9, .25, .25], 2);
  if (goal) draw(M.mul(M.t(goal.x, goal.y + .02, goal.z), M.s(2.2, .04, 2.2)), [.3, .9, .45 + .1 * Math.sin(time / 300)], 2);
  for (const o of objects) if (o.inWorld) {
    const v = .6 + .4 * o.pop, hi = o === target ? 1.25 : 1;
    draw(M.mul(M.t(o.x, o.y, o.z), M.s(o.hx * 2 * v, o.hy * 2 * v, o.hz * 2 * v)), [hi, hi, hi], 1);
  }
  if (showGhost && held && ghost) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    draw(boxM(ghost), ghost.ok ? [1, 1, 1] : [1, .3, .3], ghost.ok ? 1 : 2, .5);
    gl.depthMask(true); gl.disable(gl.BLEND);
  }
}

// ---------------------------------------------------------------- loop
let last = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  if (playing) update(dt);
  // the placement preview only exists on the phone: draw it, copy to the phone, then draw the real view
  if (held && ghost) { render(t, true); drawPhoneScreen(); render(t, false); }
  else { render(t, false); drawPhoneScreen(); }
  requestAnimationFrame(frame);
}
loadLevel(0);
requestAnimationFrame(frame);
</script>
